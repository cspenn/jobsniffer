[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobsniffer"
version = "0.1.0"
description = "Modernized job scraper library for LinkedIn, Indeed, and ZipRecruiter, forked from JobSpy"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Cullen Watson", email = "cullen@cullenwatson.com" },
    { name = "Zachary Hampton", email = "zachary@zacharysproducts.com" },
    { name = "Christopher S. Penn" },
]
keywords = ["jobs-scraper", "linkedin", "indeed", "ziprecruiter", "glassdoor", "bayt", "naukri", "bdjobs", "google-jobs"]
dependencies = [
    "curl-cffi>=0.7.4",
    "beautifulsoup4>=4.12.2",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pydantic>=2.3.0",
    "markdownify>=1.1.0",
    "regex>=2024.4.28",
    "protobuf>=5.27.0",
    "structlog>=24.1.0",
    "stamina>=24.2.0",
]

[project.urls]
Homepage = "https://github.com/cspenn/jobsniffer"
"Upstream (not accepting PRs from this fork)" = "https://github.com/speedyapply/JobSpy"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff==0.16.0",
    "radon>=6.0.1",
]
# blackboxprotobuf isn't a project dependency: it pins protobuf==3.10.0, which
# conflicts with protobuf>=5.27.0 above. Run it isolated via
# `uvx --from blackboxprotobuf python -c '...'` when reverse-engineering the
# ZipRecruiter wire schema.

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real third-party sites; opt-in only, excluded from default runs",
]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["src/jobsniffer"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]
